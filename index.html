<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://bank.gov.ua https://whitebit.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#157a5b">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FinPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div class="app">
        <header class="top">
            <div class="brand"><i aria-hidden="true"></i>FinPulse</div>
            <nav class="tabs-top" data-i18n-aria="nav.label">
                <button data-action="tab" data-tab="budget" data-i18n="nav.budget"></button>
                <button data-action="tab" data-tab="incomes" data-i18n="nav.incomes"></button>
                <button data-action="tab" data-tab="reports" data-i18n="nav.reports"></button>
                <button data-action="more" data-i18n="nav.more"></button>
            </nav>
            <div class="cycle">
                <button data-action="prev-month" data-i18n-aria="nav.prevMonth">‹</button>
                <button class="cycle-label" data-action="open-months" data-i18n-aria="nav.chooseMonth">
                    <strong id="cycle-name"></strong><span id="cycle-range"></span>
                </button>
                <button data-action="next-month" data-i18n-aria="nav.nextMonth">›</button>
            </div>
        </header>
        <main id="view" class="view"></main>
    </div>

    <nav class="nav" data-i18n-aria="nav.label">
        <button data-action="tab" data-tab="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 15h3"/></svg><span data-i18n="nav.budget"></span></button>
        <button data-action="tab" data-tab="incomes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span data-i18n="nav.incomes"></span></button>
        <button data-action="tab" data-tab="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span data-i18n="nav.reports"></span></button>
        <button data-action="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span data-i18n="nav.more"></span></button>
    </nav>
    <button class="fab" id="fab" data-action="fab"><b aria-hidden="true">+</b><span id="fab-label"></span></button>
    <div id="layer"></div>
</body>
</html>
